# UrdfConverter settings used to produce go2_nero_gripper.usd
# (mirrors the LeggedManip_Lab asset-generation convention).
#
# The actual conversion is driven by scripts/convert_go2_nero_gripper.py; this
# file documents the parameters for reference and reproducibility.
asset_path: urdf/go2_nero_gripper.urdf
usd_dir: .
usd_file_name: go2_nero_gripper.usd
force_usd_conversion: true
make_instanceable: true
fix_base: false
root_link_name: null
link_density: 0.0
merge_fixed_joints: false
convert_mimic_joints_to_normal_joints: false
joint_drive:
  drive_type: force
  target_type: none
  gains: { stiffness: 0.0, damping: 0.0 }
collision_type: Convex Hull
self_collision: false
robot_type: Mobile Manipulators
